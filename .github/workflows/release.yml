name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach binaries to releases

jobs:
  build:
    # older Ubuntu = older glibc, so the binary runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 3 headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        run: |
          mkdir dist
          cp target/release/claude-pet dist/claude-pet-x86_64-linux
          sha256sum dist/claude-pet-x86_64-linux > dist/claude-pet-x86_64-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: claude-pet-x86_64-linux
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
